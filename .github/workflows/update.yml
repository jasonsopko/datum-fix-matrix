name: Update the matrix
on:
  schedule:
    - cron: "17 * * * *"      # hourly; change to "17 6 * * *" for daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py
      - name: Commit if changed
        run: |
          git config user.name "matrix-bot"
          git config user.email "matrix-bot@users.noreply.github.com"
          git add README.md docs/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update the matrix $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
